name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch wheel keeps CI lean; tests don't need GPU
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install torch-geometric
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short

      - name: Smoke-test data pipeline
        # smoke test confirms data builders parse without crashing on a tiny slice
        run: |
          python -c "from src.data.dataset import TemporalGraphDataset; print('ok')"
          python -c "from src.models.sequential_encoder import SequentialMLP; print('ok')"
          python -c "from src.losses.rdmreg import rdmreg_loss; print('ok')"
