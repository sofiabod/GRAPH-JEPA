[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-jepa"
version = "0.1.0"
description = "Temporal Graph as Input Modality to a JEPA-based World Model"
authors = [{ name = "Sofia Bodnar", email = "sofia@sentra.app" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
keywords = [
    "JEPA",
    "joint-embedding predictive architecture",
    "temporal graphs",
    "world models",
    "self-supervised learning",
    "graph neural networks",
]
dependencies = [
    "torch>=2.3",
    "torch-geometric>=2.4",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.2",
    "pyarrow>=15",
    "tqdm>=4.66",
    "omegaconf>=2.3",
    "pyyaml>=6.0",
    "h5py>=3.10",
]

[project.optional-dependencies]
experiments = [
    "py-tgb>=0.9",
    "sentence-transformers>=2.2",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "networkx>=3.2",
]
# torch-geometric-temporal is intentionally excluded from [experiments].
# it pulls torch-sparse, which fails to build under PEP 517 isolation
# (torch-sparse's setup.py imports torch before torch is available in the
# build env). only chickenpox_builder.py uses it, and chickenpox is not in
# the paper-locked 8-dataset matrix. install separately if needed:
#   pip install --no-build-isolation 'torch-geometric-temporal>=0.55'
chickenpox = [
    "torch-geometric-temporal>=0.55",
]
modal = [
    "modal>=0.64",
    "boto3>=1.34",
    "huggingface_hub>=0.24",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "ipython>=8.20",
]

[project.urls]
Repository = "https://github.com/sofiabodnar/GRAPH-JEPA"
Documentation = "https://github.com/sofiabodnar/GRAPH-JEPA/blob/main/README.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["tests*", "experiments*", "results*", "configs*", "data*", "paper*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "**/__pycache__",
    ".venv",
    "data",
    "results",
]

[tool.ruff.lint]
# E,F = pycodestyle errors, pyflakes
# W = pycodestyle warnings
# I = isort
# N = pep8 naming
# UP = pyupgrade
# B = bugbear (likely bugs)
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = [
    "E501",  # line-too-long; we set line-length=100 above and let it slide for math
    "N806",  # uppercase variable in function (matches paper notation: B, D, M, etc.)
    "N803",  # uppercase argument (same reason)
    "N812",  # `torch.nn.functional as F` is universal pytorch convention
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]  # test method naming

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "--strict-markers",
    "--tb=short",
]
filterwarnings = [
    "ignore::DeprecationWarning:torch_geometric.*",
    "ignore::FutureWarning:torch.*",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
